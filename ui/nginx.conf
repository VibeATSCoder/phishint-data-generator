server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Server-wide upload ceiling so bulk dataset ZIPs don't 413 at the SSL layer.
    client_max_body_size 0;            # 0 = unlimited; nginx still streams to disk
    client_body_buffer_size 1m;
    client_body_timeout 600s;

    # Serve the SPA
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy API calls to the backend service
    # The UI calls /api/* and we strip /api before forwarding.
    # This allows both to run on the same origin and avoids CORS issues.
    location /api/ {
        proxy_pass         http://backend:8009/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Connection "";
        # Bulk dataset uploads can be multi-GB. No upload cap, generous timeouts.
        client_max_body_size 0;
        proxy_request_buffering off;   # stream upload to backend instead of buffering
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;
        send_timeout          1800s;
    }

    # Health check endpoint
    location /health {
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json;
}
